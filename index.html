<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raportet</title>
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raportet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f6f5f3;
    --ink: #15171c;
    --muted: #71757e;
    --line: #e7e5e0;
    --accent: #15171c;       /* butoni kryesor */
    --accent-ink: #ffffff;
    --mark: #9e7328;         /* vendi i parë */
    --alert: #9a3b2c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1013;
      --surface: #171920;
      --ink: #eeece7;
      --muted: #9a9ea8;
      --line: #262931;
      --accent: #d6b070;
      --accent-ink: #14151a;
      --mark: #d6b070;
      --alert: #d98d7e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1013;
    --surface: #171920;
    --ink: #eeece7;
    --muted: #9a9ea8;
    --line: #262931;
    --accent: #d6b070;
    --accent-ink: #14151a;
    --mark: #d6b070;
    --alert: #d98d7e;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 560px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px calc(env(safe-area-inset-bottom, 0px) + 40px);
    -webkit-font-smoothing: antialiased;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .day { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }

  .ghost {
    font: inherit; font-size: 0.88rem; color: var(--muted); cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
  }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #input {
    display: block; width: 100%; min-height: 160px; resize: vertical;
    background: var(--surface); color: var(--ink);
    border: 1px solid transparent; border-radius: 12px; padding: 14px 16px;
    font: inherit; font-size: 15px; line-height: 1.6;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus { border-color: var(--line); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }

  .tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .tools-left { display: flex; gap: 8px; }
  .tools button {
    font: inherit; font-size: 0.95rem; cursor: pointer; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px;
  }
  .tools button:hover { border-color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
  .toggle input { width: 17px; height: 17px; accent-color: var(--accent); }

  .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 44px 0 8px; }
  .listhead h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .count { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }

  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li {
    display: grid; grid-template-columns: 24px 1fr auto; gap: 14px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .rank { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  li.first .rank, li.first .total { color: var(--mark); }
  .name { font-weight: 500; }
  .detail { display: block; color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
  .again { color: var(--alert); font-size: 0.78rem; margin-left: 8px; }
  .total { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

  .note { color: var(--muted); font-size: 0.9rem; margin: 20px 0 0; }
  .note b { color: var(--ink); font-weight: 600; }

  .copy {
    display: block; width: 100%; margin-top: 32px; padding: 15px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .copy:disabled { background: var(--surface); color: var(--muted); cursor: default; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 0.9rem;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
  <header>
    <h1>Raportet</h1>
    <button class="ghost" id="theme" type="button"></button>
  </header>
  <p class="day" id="day"></p>

  <textarea id="input" placeholder="Ngjit këtu mesazhet nga Telegram"></textarea>

  <div class="tools">
    <div class="tools-left">
      <button id="paste" type="button">Ngjit</button>
      <button id="clear" type="button">Fshij</button>
    </div>
    <label class="toggle"><input type="checkbox" id="lastOnly"> Vetëm raporti i fundit</label>
  </div>

  <div class="listhead">
    <h2>Rendi i sotëm</h2>
    <span class="count" id="count"></span>
  </div>

  <ol id="list"></ol>
  <p class="note" id="empty">Ngjit mesazhet lart dhe rendi del këtu.</p>
  <p class="note" id="warn" hidden></p>

  <button class="copy" id="copy" type="button" disabled>Kopjo listën</button>
  <div class="toast" id="toast"></div>

<script>
// ---------- Leximi i mesazheve ----------
const KEYWORD = /l[eë]x|d[eë]gj/i;
// "[17.09.26, 12:50] Emri: mesazhi"  (kopjim nga telefoni)
const HEADER_BRACKET = /^\[[^\]]*\]\s*([^:\[\]]{2,60}?):\s*(.*)$/;
// "Emri, [17.09.26 12:50]"  (kopjim nga Telegram Desktop)
const HEADER_DESKTOP = /^(.{2,60}?),\s*\[[^\]]*\]:?$/;
// "Emri:"
const HEADER_PLAIN = /^([^\d:]{2,60}):$/;

function kindOf(text) {
  if (/l[eë]x/i.test(text)) return 'lexim';
  if (/d[eë]gj/i.test(text)) return 'dëgjim';
  return null;
}

function parseReports(text) {
  const reports = [];
  let current = null;
  const start = (name, rest) => {
    current = { name: name.trim().replace(/\s+/g, ' '), lines: [] };
    reports.push(current);
    if (rest) current.lines.push(rest);
  };
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    let m;
    if ((m = line.match(HEADER_BRACKET)) && !KEYWORD.test(m[1])) { start(m[1], m[2]); continue; }
    if ((m = line.match(HEADER_DESKTOP))) { start(m[1]); continue; }
    if ((m = line.match(HEADER_PLAIN)) && !KEYWORD.test(m[1])) { start(m[1]); continue; }
    if (current) current.lines.push(line);
  }
  return reports.map(r => ({ name: r.name, parts: extractParts(r.lines) }));
}

// Nxjerr numrat nga mesazhi dhe, kur mundet, a janë dëgjim apo lexim.
function extractParts(lines) {
  const parts = [];
  for (const line of lines) {
    const nums = [...line.matchAll(/\d+/g)];
    if (!nums.length) continue;
    // "Lexim 8" (fjala para numrit) apo "8 lexim" (fjala pas numrit)
    const keywordFirst = kindOf(line.slice(0, nums[0].index)) !== null;
    nums.forEach((m, i) => {
      const n = parseInt(m[0], 10);
      if (n > 999) return; // vite, orë etj.
      const end = m.index + m[0].length;
      const segment = keywordFirst
        ? line.slice(i > 0 ? nums[i - 1].index + nums[i - 1][0].length : 0, m.index)
        : line.slice(end, i + 1 < nums.length ? nums[i + 1].index : line.length);
      parts.push({ n, kind: kindOf(segment) });
    });
  }
  return parts;
}

function aggregate(reports, lastOnly) {
  const byName = new Map();
  for (const r of reports) {
    const key = r.name.toLocaleLowerCase('sq');
    let s = byName.get(key);
    if (!s) { s = { name: r.name, total: 0, parts: [], count: 0 }; byName.set(key, s); }
    if (!r.parts.length) continue;
    const t = r.parts.reduce((a, p) => a + p.n, 0);
    if (lastOnly) { s.total = t; s.parts = r.parts; }
    else { s.total += t; s.parts = s.parts.concat(r.parts); }
    s.count++;
  }
  const all = [...byName.values()];
  return {
    ranked: all.filter(s => s.count > 0).sort((a, b) => b.total - a.total),
    noNumbers: all.filter(s => s.count === 0),
  };
}

function toCopyText(ranked) {
  return ranked.map((s, i) => `${i + 1}. ${s.name} – ${s.total}`).join('\n');
}

// ---------- Ndërfaqja ----------
const $ = id => document.getElementById(id);
const input = $('input'), list = $('list'), copyBtn = $('copy'), lastOnly = $('lastOnly');
let copyText = '';

$('day').textContent = new Date().toLocaleDateString('sq-AL', { weekday: 'long', day: 'numeric', month: 'long' });

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const { ranked, noNumbers } = aggregate(parseReports(input.value), lastOnly.checked);
  copyText = toCopyText(ranked);

  list.innerHTML = ranked.map((s, i) => {
    const detail = s.parts.map(p => p.kind ? `${p.n} ${p.kind}` : p.n).join(' + ');
    const again = s.count > 1 ? `<span class="again">raportoi ${s.count} herë</span>` : '';
    return `<li class="${i === 0 ? 'first' : ''}">
      <span class="rank">${i + 1}</span>
      <span><span class="name">${escapeHtml(s.name)}</span>${again}<span class="detail">${escapeHtml(detail)}</span></span>
      <span class="total">${s.total}</span>
    </li>`;
  }).join('');

  $('empty').hidden = ranked.length > 0;
  copyBtn.disabled = ranked.length === 0;
  const sum = ranked.reduce((a, s) => a + s.total, 0);
  $('count').textContent = ranked.length ? `${ranked.length} nxënës, gjithsej ${sum}` : '';

  const warn = $('warn');
  warn.hidden = noNumbers.length === 0;
  warn.innerHTML = noNumbers.length
    ? `Pa numra, jashtë rendit: <b>${noNumbers.map(s => escapeHtml(s.name)).join(', ')}</b>`
    : '';

  try { localStorage.setItem('raportet.text', input.value); localStorage.setItem('raportet.lastOnly', lastOnly.checked ? '1' : ''); } catch {}
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy');
  ta.remove();
  return ok;
}

// ---------- Pamja e errët dhe e ndritshme ----------
const themeBtn = $('theme');
const systemDark = matchMedia('(prefers-color-scheme: dark)');

function isDark() {
  const saved = document.documentElement.dataset.theme;
  return saved ? saved === 'dark' : systemDark.matches;
}

function applyTheme(mode) {
  if (mode) document.documentElement.dataset.theme = mode;
  else delete document.documentElement.dataset.theme;
  const dark = isDark();
  themeBtn.textContent = dark ? 'E ndritshme' : 'E errët';
  themeBtn.setAttribute('aria-label', dark ? 'Kalo në pamje të ndritshme' : 'Kalo në pamje të errët');
  $('themeColor').content = dark ? '#0f1013' : '#ffffff';
}

themeBtn.addEventListener('click', () => {
  const mode = isDark() ? 'light' : 'dark';
  applyTheme(mode);
  try { localStorage.setItem('raportet.theme', mode); } catch {}
});
systemDark.addEventListener('change', () => { if (!document.documentElement.dataset.theme) applyTheme(null); });

input.addEventListener('input', render);
lastOnly.addEventListener('change', render);
copyBtn.addEventListener('click', async () => toast(await copyToClipboard(copyText) ? 'Lista u kopjua' : 'Lista nuk u kopjua'));
$('clear').addEventListener('click', () => { input.value = ''; render(); input.focus(); });
$('paste').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) { input.value = text; render(); }
  } catch { input.focus(); toast('Mbaj gishtin në kuti dhe zgjidh Paste'); }
});

let savedTheme = null;
try {
  savedTheme = localStorage.getItem('raportet.theme');
  input.value = localStorage.getItem('raportet.text') || '';
  lastOnly.checked = !!localStorage.getItem('raportet.lastOnly');
} catch {}
applyTheme(savedTheme);
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
